<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">


    <ui:define name="title">#{routeBean.route.routeId == null ? 'Add Route' : 'Edit Route'} · Kigali Bus Management</ui:define>

    <ui:define name="content">
        <script type="text/javascript">
            //<![CDATA[
            function validateRouteForm() {
                var start = document.getElementById('routeForm:startPoint').value.trim();
                var end = document.getElementById('routeForm:endPoint').value.trim();
                var distance = document.getElementById('routeForm:distanceKm').value.trim();
                var duration = document.getElementById('routeForm:estimatedDuration').value.trim();
                var durationRegex = /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/;

                if (start.toLowerCase() === end.toLowerCase()) {
                    alert('Start point and end point must be different.');
                    return false;
                }
                if (distance === '' || isNaN(distance) || Number(distance) < 0.5 || Number(distance) > 300) {
                    alert('Distance must be between 0.5 and 300 km.');
                    return false;
                }
                if (!durationRegex.test(duration)) {
                    alert('Duration must use HH:mm format, e.g. 01:30.');
                    return false;
                }
                return true;
            }
            //]]>
        </script>

        <section class="page-heading">
            <div>
                <h2>#{routeBean.route.routeId == null ? 'Add New Route' : 'Edit Route'}</h2>
                <p>Fields marked with * are required.</p>
            </div>
        </section>

        <h:messages globalOnly="true" showDetail="true"
                    infoClass="message message-info"
                    warnClass="message message-warn"
                    errorClass="message message-error"/>

        <h:form id="routeForm" styleClass="form-card" onsubmit="return validateRouteForm();">
            <div class="form-grid">
                <div class="form-group full-width">
                    <h:outputLabel for="routeName" value="Route Name *"/>
                    <h:inputText id="routeName" value="#{routeBean.route.routeName}" required="true"
                                 requiredMessage="Route name is required." maxlength="60"
                                 pt:placeholder="e.g. Downtown - Remera">
                        <f:validateLength minimum="3" maximum="60"/>
                    </h:inputText>
                    <h:message for="routeName" styleClass="field-error"/>
                </div>

                <div class="form-group">
                    <h:outputLabel for="startPoint" value="Start Point *"/>
                    <h:inputText id="startPoint" value="#{routeBean.route.startPoint}" required="true"
                                 requiredMessage="Start point is required." maxlength="50" pt:placeholder="Downtown">
                        <f:validateLength minimum="2" maximum="50"/>
                    </h:inputText>
                    <h:message for="startPoint" styleClass="field-error"/>
                </div>

                <div class="form-group">
                    <h:outputLabel for="endPoint" value="End Point *"/>
                    <h:inputText id="endPoint" value="#{routeBean.route.endPoint}" required="true"
                                 requiredMessage="End point is required." maxlength="50" pt:placeholder="Remera">
                        <f:validateLength minimum="2" maximum="50"/>
                    </h:inputText>
                    <h:message for="endPoint" styleClass="field-error"/>
                </div>

                <div class="form-group">
                    <h:outputLabel for="distanceKm" value="Distance (km) *"/>
                    <h:inputText id="distanceKm" value="#{routeBean.route.distanceKm}" required="true"
                                 requiredMessage="Distance is required." pt:type="number" pt:step="0.1" pt:min="0.5" pt:max="300">
                        <f:validateDoubleRange minimum="0.5" maximum="300"/>
                    </h:inputText>
                    <h:message for="distanceKm" styleClass="field-error"/>
                </div>

                <div class="form-group">
                    <h:outputLabel for="estimatedDuration" value="Estimated Duration (HH:mm) *"/>
                    <h:inputText id="estimatedDuration" value="#{routeBean.route.estimatedDuration}" required="true"
                                 requiredMessage="Estimated duration is required." maxlength="5" pt:placeholder="01:30">
                        <f:validateRegex pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"/>
                    </h:inputText>
                    <h:message for="estimatedDuration" styleClass="field-error"/>
                </div>
            </div>

            <div class="form-actions" style="margin-top:22px;">
                <h:commandButton value="Save Route" action="#{routeBean.saveRoute}" styleClass="btn btn-primary"/>
                <h:link outcome="/route-list" value="Cancel" styleClass="btn btn-light"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
