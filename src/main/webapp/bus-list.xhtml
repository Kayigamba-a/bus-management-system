<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="title">Buses · Kigali Bus Management</ui:define>

    <ui:define name="content">
        <section class="page-heading">
            <div>
                <h2>Buses</h2>
                <p>Register and maintain the bus fleet.</p>
            </div>
            <h:link outcome="/bus-form" value="+ Register Bus" styleClass="btn btn-primary"/>
        </section>

        <h:panelGroup id="messages" layout="block">
            <h:messages globalOnly="true" showDetail="true"
                        infoClass="message message-info"
                        warnClass="message message-warn"
                        errorClass="message message-error"/>
        </h:panelGroup>

        <h:form id="searchForm" styleClass="search-bar">
            <h:inputText value="#{busBean.searchText}" styleClass="search-input"
                         pt:placeholder="Search plate, model or status"/>
            <h:commandButton value="Search" action="#{busBean.loadBuses}" styleClass="btn btn-secondary">
            </h:commandButton>
            <h:commandButton value="Clear" action="#{busBean.clearSearch}" styleClass="btn btn-light">
            </h:commandButton>
        </h:form>


        <h:panelGroup id="busTable" layout="block">
            <h:panelGroup rendered="#{empty busBean.busList}" layout="block" styleClass="empty-state">
                No buses found. Register the first bus to get started.
            </h:panelGroup>

            <h:dataTable value="#{busBean.busList}" var="b" styleClass="data-table"
                         rendered="#{not empty busBean.busList}">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{b.busId}
                </h:column>
                <h:column>
                    <f:facet name="header">Plate Number</f:facet>
                    <strong>#{b.plateNumber}</strong>
                </h:column>
                <h:column>
                    <f:facet name="header">Model</f:facet>
                    #{b.model}
                </h:column>
                <h:column>
                    <f:facet name="header">Capacity</f:facet>
                    #{b.capacity} seats
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    <span class="status #{b.status == 'ACTIVE' ? 'status-active' : (b.status == 'MAINTENANCE' ? 'status-maintenance' : 'status-inactive')}">#{b.status}</span>
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:form styleClass="action-row">
                        <h:commandLink value="Edit" action="#{busBean.editBus(b.busId)}" styleClass="btn btn-edit"/>
                        <h:commandButton value="Delete" action="#{busBean.deleteBus(b.busId)}" styleClass="btn btn-delete"
                                         onclick="return confirm('Delete bus #{b.plateNumber}?');"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </h:panelGroup>
    </ui:define>
</ui:composition>
