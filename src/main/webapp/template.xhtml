<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title><ui:insert name="title">Kigali Bus Management System</ui:insert></title>
    <h:outputStylesheet library="css" name="styles.css"/>

    <!-- Internal CSS: retained because the assignment requires multiple CSS methods. -->
    <style type="text/css">
        .footer-note { text-align:center; font-size:12px; color:#758399; padding:12px 0 26px; }
        .brand-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#51c878; margin-right:8px; }
    </style>
</h:head>
<h:body>
    <header class="app-header">
        <div class="shell header-inner">
            <div>
                <h1><span class="brand-dot"></span>Kigali Bus Management System</h1>
                <p>Bus and route administration console</p>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="shell nav-inner" style="display:flex;align-items:center;gap:8px;">
            <h:link outcome="/index" value="Dashboard" styleClass="nav-link"/>
            <h:link outcome="/bus-list" value="Buses" styleClass="nav-link"/>
            <h:link outcome="/route-list" value="Routes" styleClass="nav-link"/>
        </div>
    </nav>

    <main class="shell content-wrapper">
        <ui:insert name="content"/>
    </main>

    <div class="footer-note">
        Kigali Bus Management System · JSF 2.3 · Hibernate 5.6 · PostgreSQL
    </div>
</h:body>
</html>
