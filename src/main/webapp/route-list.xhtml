<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="title">Routes · Kigali Bus Management</ui:define>

    <ui:define name="content">
        <section class="page-heading">
            <div>
                <h2>Routes</h2>
                <p>Create and maintain bus routes.</p>
            </div>
            <h:link outcome="/route-form" value="+ Add Route" styleClass="btn btn-primary"/>
        </section>

        <h:panelGroup id="messages" layout="block">
            <h:messages globalOnly="true" showDetail="true"
                        infoClass="message message-info"
                        warnClass="message message-warn"
                        errorClass="message message-error"/>
        </h:panelGroup>

        <h:form id="routeSearchForm" styleClass="search-bar">
            <h:inputText value="#{routeBean.searchText}" styleClass="search-input"
                         pt:placeholder="Search name, start or end point"/>
            <h:commandButton value="Search" action="#{routeBean.loadRoutes}" styleClass="btn btn-secondary">
            </h:commandButton>
            <h:commandButton value="Clear" action="#{routeBean.clearSearch}" styleClass="btn btn-light">
            </h:commandButton>
        </h:form>

        <h:panelGroup id="routeTable" layout="block">
            <h:panelGroup rendered="#{empty routeBean.routeList}" layout="block" styleClass="empty-state">
                No routes found. Add the first route to get started.
            </h:panelGroup>

            <h:dataTable value="#{routeBean.routeList}" var="r" styleClass="data-table"
                         rendered="#{not empty routeBean.routeList}">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{r.routeId}
                </h:column>
                <h:column>
                    <f:facet name="header">Route</f:facet>
                    <strong>#{r.routeName}</strong>
                </h:column>
                <h:column>
                    <f:facet name="header">From</f:facet>
                    #{r.startPoint}
                </h:column>
                <h:column>
                    <f:facet name="header">To</f:facet>
                    #{r.endPoint}
                </h:column>
                <h:column>
                    <f:facet name="header">Distance</f:facet>
                    #{r.distanceKm} km
                </h:column>
                <h:column>
                    <f:facet name="header">Duration</f:facet>
                    #{r.estimatedDuration}
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:form styleClass="action-row">
                        <h:commandLink value="Edit" action="#{routeBean.editRoute(r.routeId)}" styleClass="btn btn-edit"/>
                        <h:commandButton value="Delete" action="#{routeBean.deleteRoute(r.routeId)}" styleClass="btn btn-delete"
                                         onclick="return confirm('Delete route #{r.routeName}?');"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </h:panelGroup>
    </ui:define>
</ui:composition>
