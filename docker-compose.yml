services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kbms
      POSTGRES_USER: kbms
      POSTGRES_PASSWORD: kbms_dev_password
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbms"]
      interval: 5s
      retries: 15
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      TZ: Africa/Kigali
      DB_URL: jdbc:postgresql://postgres:5432/kbms
      DB_USER: kbms
      DB_PASSWORD: kbms_dev_password
      MONGO_URI: mongodb://mongodb:27017/kbms
      RABBIT_HOST: rabbitmq
      FRONTEND_ORIGIN: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_COOKIE_SECURE: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kbms.rw}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      mongodb: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on: [backend]
volumes:
  pgdata:
  mongodata:
